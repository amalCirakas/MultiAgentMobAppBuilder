openapi: 3.1.0
info:
  title: {{APP_TITLE}} API
  version: 0.1.0
  summary: Reviewed source-of-truth REST contract for {{APP_TITLE}}.
  description: |
    App prompt:
    {{APP_PROMPT_BLOCK}}

    This OpenAPI document is generated before implementation and should be reviewed
    at the shift-left gate. Runtime code should conform to this contract unless the
    blueprint is deliberately revised first.
  x-app-slug: {{APP_SLUG}}
  x-build-stack: {{BUILD_STACK}}
  x-backend-runtime: {{BACKEND_RUNTIME}}
servers:
  - url: http://localhost:3090/api/v1
    description: Local development API
tags:
  - name: Health
  - name: Auth
  - name: Users
  - name: Resources
  - name: Search
  - name: Files
  - name: Sync
  - name: Audit
paths:
  /health:
    get:
      tags: [Health]
      summary: Check service health.
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/session:
    post:
      tags: [Auth]
      summary: Create a session.
      operationId: createSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Auth]
      summary: End the current session.
      operationId: deleteSession
      responses:
        "204":
          description: Session ended.
  /users/me:
    get:
      tags: [Users]
      summary: Read the current user profile.
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /resources:
    get:
      tags: [Resources]
      summary: List domain resources.
      operationId: listResources
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/UpdatedSince"
      responses:
        "200":
          description: Paginated resources.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcePage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Resources]
      summary: Create a domain resource.
      operationId: createResource
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceInput"
      responses:
        "201":
          description: Resource created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /resources/{resourceId}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags: [Resources]
      summary: Read one domain resource.
      operationId: getResource
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resource details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Resources]
      summary: Update one domain resource.
      operationId: updateResource
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourcePatch"
      responses:
        "200":
          description: Resource updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Resources]
      summary: Delete or archive one domain resource.
      operationId: deleteResource
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Resource removed.
        "404":
          $ref: "#/components/responses/NotFound"
  /search:
    get:
      tags: [Search]
      summary: Search app data.
      operationId: search
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Search results.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResultPage"
  /files:
    post:
      tags: [Files]
      summary: Register uploaded file metadata.
      operationId: createFile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FileInput"
      responses:
        "201":
          description: File metadata registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileRecord"
  /sync/jobs:
    post:
      tags: [Sync]
      summary: Request a sync job.
      operationId: createSyncJob
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncJobRequest"
      responses:
        "202":
          description: Sync accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncJob"
  /audit-logs:
    get:
      tags: [Audit]
      summary: List audit log entries.
      operationId: listAuditLogs
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/PageCursor"
        - $ref: "#/components/parameters/PageLimit"
      responses:
        "200":
          description: Audit log page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogPage"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PageCursor:
      name: cursor
      in: query
      schema:
        type: string
    PageLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    UpdatedSince:
      name: updatedSince
      in: query
      schema:
        type: string
        format: date-time
    ResourceId:
      name: resourceId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Authentication required or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested resource was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request did not satisfy the contract.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      required: [status, checkedAt]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checkedAt:
          type: string
          format: date-time
    CreateSessionRequest:
      type: object
      required: [identifier, secret]
      properties:
        identifier:
          type: string
        secret:
          type: string
          format: password
    Session:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      required: [id, displayName, createdAt, updatedAt]
      properties:
        id:
          type: string
        displayName:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ResourceInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [draft, active, archived]
          default: active
        attributes:
          type: object
          additionalProperties: true
    ResourcePatch:
      allOf:
        - $ref: "#/components/schemas/ResourceInput"
    Resource:
      allOf:
        - $ref: "#/components/schemas/ResourceInput"
        - type: object
          required: [id, createdAt, updatedAt]
          properties:
            id:
              type: string
            ownerId:
              type: string
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
    ResourcePage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        page:
          $ref: "#/components/schemas/PageInfo"
    SearchResultPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        page:
          $ref: "#/components/schemas/PageInfo"
    SearchResult:
      type: object
      required: [id, type, title]
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        excerpt:
          type: string
    FileInput:
      type: object
      required: [filename, contentType, sizeBytes]
      properties:
        filename:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
    FileRecord:
      allOf:
        - $ref: "#/components/schemas/FileInput"
        - type: object
          required: [id, createdAt]
          properties:
            id:
              type: string
            url:
              type: string
              format: uri
            createdAt:
              type: string
              format: date-time
    SyncJobRequest:
      type: object
      required: [scope]
      properties:
        scope:
          type: string
          enum: [all, changed, resource]
        resourceId:
          type: string
    SyncJob:
      type: object
      required: [id, status, createdAt]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed]
        createdAt:
          type: string
          format: date-time
    AuditLogPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        page:
          $ref: "#/components/schemas/PageInfo"
    AuditLogEntry:
      type: object
      required: [id, actorId, action, createdAt]
      properties:
        id:
          type: string
        actorId:
          type: string
        action:
          type: string
        targetType:
          type: string
        targetId:
          type: string
        createdAt:
          type: string
          format: date-time
    PageInfo:
      type: object
      required: [limit, hasMore]
      properties:
        cursor:
          type: string
        nextCursor:
          type: string
        limit:
          type: integer
        hasMore:
          type: boolean
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
